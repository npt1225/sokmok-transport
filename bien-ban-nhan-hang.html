<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Biên bản nhận hàng – Sokmok Transport</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
    <style>
        :root {
            --bg: #f3f5f8;
            --cd: #fff;
            --tx: #17212b;
            --mu: #5f6b7a;
            --bd: #d5dbe3;
            --pr: #c8102e;
            --in: #f9fbfd;
            --ng: #c0392b;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #10151b;
                --cd: #18202a;
                --tx: #e6ebf1;
                --mu: #93a0b0;
                --bd: #2c3745;
                --pr: #ff6670;
                --in: #1d2733
            }
        }

        :root[data-theme="dark"] {
            --bg: #10151b;
            --cd: #18202a;
            --tx: #e6ebf1;
            --mu: #93a0b0;
            --bd: #2c3745;
            --pr: #ff6670;
            --in: #1d2733
        }

        html,
        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.5 'Be Vietnam Pro', 'Segoe UI', Roboto, Arial, sans-serif
        }

        * {
            box-sizing: border-box
        }

        .top {
            max-width: 1100px;
            margin: 0 auto;
            padding: 18px 16px 12px;
            display: flex;
            align-items: center;
            gap: 14px
        }

        .top img {
            width: 88px;
            height: auto;
            border-radius: 10px;
            background: #fff;
            flex: none
        }

        .top h1 {
            font-size: 22px;
            margin: 0 0 2px;
            color: var(--pr)
        }

        .top span {
            font-size: 12.5px;
            color: var(--mu)
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--in);
            color: var(--tx)
        }

        button {
            padding: 7px 14px;
            cursor: pointer;
            background: var(--cd)
        }

        button.p {
            background: var(--pr);
            border-color: var(--pr);
            color: #fff;
            font-weight: 600
        }

        button:disabled {
            opacity: .55;
            cursor: default
        }

        #bbnh {
            padding: 13px 26px;
            font-size: 16px;
            border-radius: 12px
        }

        .hid {
            display: none !important
        }

        #md {
            padding: 0 16px 24px
        }

        .dlg {
            background: var(--cd);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 22px;
            width: 100%;
            max-width: 580px;
            max-height: 92vh;
            overflow: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .35)
        }

        .dlg h3 {
            margin: 0 0 14px;
            font-size: 19px;
            color: var(--pr)
        }

        .dlg p {
            margin: 0
        }

        .act {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px
        }

        .act button {
            padding: 8px 16px
        }

        #md .dlg.bbd {
            max-width: 1100px;
            margin: 0 auto;
            max-height: none;
            height: max(640px, calc(100vh - 130px))
        }

        @media(max-width:900px) {
            #md {
                padding: 0 8px 16px
            }

            #md .dlg.bbd {
                max-height: none;
                height: max(600px, calc(100vh - 110px))
            }

            .top img {
                width: 64px
            }

            .top h1 {
                font-size: 18px
            }
        }

        #md .dlg.bbd {
            position: relative;
            max-width: 1100px;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 94vh
        }

        .bbd .bbh {
            padding: 18px 56px 12px 22px;
            border-bottom: 1px solid var(--bd)
        }

        .bbd .bbh h3 {
            margin: 0
        }

        .bbd .bbh p {
            font-size: 12.5px;
            color: var(--mu);
            margin-top: 4px
        }

        .bbd .bbb {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            min-height: 0;
            flex: 1;
            overflow: hidden
        }

        .bbd .bbf {
            padding: 14px 22px 6px;
            overflow: auto
        }

        .bbd .bbp {
            background: rgba(127, 140, 160, .13);
            border-left: 1px solid var(--bd);
            padding: 14px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px
        }

        .bbd .bbp canvas {
            width: 100%;
            height: auto;
            background: #fff;
            border-radius: 3px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .28)
        }

        .bbd .bbp small {
            font-size: 11.5px;
            color: var(--mu);
            text-align: center
        }

        .bbd,
        .bbd * {
            box-sizing: border-box
        }

        .bbd .bbs {
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px 14px 14px;
            margin-bottom: 12px;
            background: var(--in)
        }

        .bbd .bbs>b {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            margin-bottom: 10px;
            color: var(--tx)
        }

        .bbd .bbs>b i {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--pr);
            color: #fff;
            font-style: normal;
            font-size: 12px;
            display: grid;
            place-items: center;
            flex: none
        }

        .bbd .bbs>b span {
            margin-left: auto;
            font-weight: 400;
            font-size: 12px;
            color: var(--mu)
        }

        .bbd .bbg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .bbd .bbg .w {
            grid-column: 1/-1
        }

        .bbd .bbg label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            color: var(--mu);
            min-width: 0
        }

        .bbd .bbg input,
        .bbd .bbg select,
        .bbd .bbg textarea {
            width: 100%;
            padding: 8px 9px;
            min-width: 0;
            font: inherit;
            color: var(--tx)
        }

        .bbd .bbg textarea {
            resize: vertical;
            min-height: 54px
        }

        .bbd .bbr {
            display: grid;
            grid-template-columns: 22px 86px minmax(0, 1.7fr) 74px 66px minmax(0, 1fr) 30px;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px
        }

        .bbd .bbr input {
            padding: 7px 8px;
            width: 100%;
            min-width: 0
        }

        .bbd .bbr .n {
            font-size: 12px;
            color: var(--mu);
            text-align: center
        }

        .bbd .bbr .rx {
            padding: 0;
            height: 30px;
            width: 30px;
            line-height: 1
        }

        .bbd .bbrh {
            font-size: 11px;
            color: var(--mu);
            margin-bottom: 4px
        }

        .bbd .bbrh span {
            padding-left: 2px
        }

        .bbd .bbtools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px
        }

        .bbd .bbtools button {
            padding: 7px 12px;
            font-size: 12.5px
        }

        .bbd .bbtot {
            margin-left: auto;
            font-size: 13px;
            color: var(--tx);
            align-self: center
        }

        .bbd .bbtot b {
            color: var(--pr)
        }

        .bbd .bbck {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .bbd .bbck label {
            flex-direction: row;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 8px 11px;
            background: var(--cd);
            color: var(--tx);
            font-size: 12.5px;
            cursor: pointer
        }

        .bbd .bbck label:has(input:checked) {
            border-color: var(--pr);
            box-shadow: 0 0 0 1px var(--pr) inset
        }

        .bbd .bbck input {
            width: auto;
            padding: 0
        }

        .bbd .bbop {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: var(--tx);
            margin-top: 10px;
            cursor: pointer
        }

        .bbd .bbop input {
            width: auto;
            padding: 0
        }

        .bbd .bba {
            margin: 0;
            padding: 12px 22px;
            border-top: 1px solid var(--bd);
            background: var(--cd);
            flex-wrap: wrap;
            position: static
        }

        .bbd .bba .bbmv {
            display: none
        }

        .bbd .bbe {
            color: var(--ng);
            font-size: 12.5px;
            margin-right: auto;
            align-self: center
        }

        @media(max-width:900px) {
            #md .dlg.bbd {
                max-height: 96vh
            }

            .bbd .bbb {
                grid-template-columns: 1fr
            }

            .bbd .bbp {
                display: none;
                border-left: 0
            }

            .bbd.pv .bbp {
                display: flex
            }

            .bbd.pv .bbf {
                display: none
            }

            .bbd .bba .bbmv {
                display: inline-block
            }

            .bbd .bbg {
                grid-template-columns: 1fr
            }

            .bbd .bbf {
                padding: 12px 12px 4px
            }

            .bbd .bbh {
                padding: 14px 52px 10px 14px
            }

            .bbd .bba {
                padding: 10px 12px
            }

            .bbd .bbrh {
                display: none
            }

            .bbd .bbr {
                grid-template-columns: 1fr 70px 70px 30px;
                padding: 8px;
                border: 1px dashed var(--bd);
                border-radius: 10px
            }

            .bbd .bbr .n {
                display: none
            }

            .bbd .bbr .rn {
                grid-column: 1/-1;
                grid-row: 1
            }

            .bbd .bbr .rc {
                grid-row: 2
            }

            .bbd .bbr .ru {
                grid-row: 2
            }

            .bbd .bbr .rq {
                grid-row: 2
            }

            .bbd .bbr .rx {
                grid-row: 2
            }

            .bbd .bbr .rt {
                grid-column: 1/-1;
                grid-row: 3
            }
        }
    </style>
</head>

                function addRow(v) {
                    v = v || {}; var n = box.children.length; if (n >= MAXR) { G('bbfe').textContent = 'Tối đa ' + MAXR + ' dòng hàng cho 1 biên bản.'; return }
                    var r = document.createElement('div'); r.className = 'bbr';
                    r.innerHTML = '<span class="n"></span><input class="rc" placeholder="Mã KH" value="' + E(v.code) + '"><input class="rn" placeholder="Tên hàng" value="' + E(v.name) + '"><input class="ru" list="bbul" placeholder="ĐVT" value="' + E(v.unit || 'kiện') + '"><input class="rq" type="number" min="0" step="any" placeholder="SL" value="' + E(v.qty) + '"><input class="rt" placeholder="Ghi chú" value="' + E(v.note) + '"><button type="button" class="rx" title="Xóa dòng">×</button>';
                    r.querySelector('.rx').onclick = function () { if (box.children.length > 1) { r.remove(); renum(); draw() } else { r.querySelectorAll('input').forEach(function (i) { i.value = '' }); r.querySelector('.ru').value = 'kiện'; draw() } };
                    box.appendChild(r); renum()
                }
                function renum() { [].forEach.call(box.children, function (r, i) { r.querySelector('.n').textContent = i + 1 }); G('bbad').disabled = box.children.length >= MAXR }
                function items() { return [].map.call(box.children, function (r) { return { code: r.querySelector('.rc').value.trim(), name: r.querySelector('.rn').value.trim(), unit: r.querySelector('.ru').value.trim(), qty: r.querySelector('.rq').value, note: r.querySelector('.rt').value.trim() } }) }
                function data() {
                    var st = dlg.querySelector('input[name=bbs]:checked');
                    return { no: G('bbno').value.trim(), date: G('bbdt').value, place: G('bbpl').value.trim(), a: { name: G('bban').value.trim(), phone: G('bbap').value.trim(), company: G('bbac').value.trim(), addr: G('bbaa').value.trim() }, b: { name: G('bbbn').value.trim(), phone: G('bbbp').value.trim(), company: G('bbbc').value.trim(), addr: G('bbba').value.trim() }, items: items(), status: st ? +st.value : -1, note: G('bbnt').value.trim(), recvLine: G('bbrl').checked }
                }
                function draw() {
                    cancelAnimationFrame(raf); raf = requestAnimationFrame(function () {
                        var d = data(), t = d.items.reduce(function (a, b) { return a + num(b.qty) }, 0), n = d.items.filter(function (i) { return i.name || i.qty }).length;
                        G('bbtt').innerHTML = t ? 'Tổng: <b>' + fmtN(t) + '</b> · ' + n + ' dòng' : ''; G('bbcn').textContent = box.children.length + '/' + MAXR + ' dòng';
                        paint(cv, d, 1.6, logo)
                    })
                }
                addRow({}); draw(); if (!logo) { var li = document.querySelector('.lgo'); if (li) li.onload = function () { logo = getLogo(); draw() } }
                fontsReady().then(function () { if (G('bbcv')) draw() });
                dlg.addEventListener('input', function () { G('bbfe').textContent = ''; draw() }); dlg.addEventListener('change', draw);
                G('bbad').onclick = function () { addRow({}); draw(); var l = box.lastChild; if (l) l.querySelector('.rn').focus() };
                G('bbmv').onclick = function () { dlg.classList.toggle('pv'); G('bbmv').textContent = dlg.classList.contains('pv') ? '✎ Quay lại nhập' : '👁 Xem trước'; draw() };

                /* chọn khách có sẵn → tự điền SĐT / địa chỉ */
                G('bban').addEventListener('input', function () { this.dataset.key = '' });
                G('bban').addEventListener('change', function () {
                    var k = this.value.trim(), c = CT[k]; if (!c) return; this.dataset.key = k;
                    this.value = ((c.g ? c.g + ' ' : '') + (c.n || k)).trim();
                    if (!G('bbap').value) G('bbap').value = c.p || ''; if (!G('bbaa').value) G('bbaa').value = c.a || ''; draw()
                });
                /* lấy dòng hàng từ đơn hàng của khách trong tháng đang chọn */
                G('bbfo').onclick = function () {
                    var key = (G('bban').dataset.key || G('bban').value).trim().toLowerCase(), fe = G('bbfe'); if (!key) { fe.textContent = 'Nhập tên bên giao trước để lấy đơn hàng của khách đó.'; return }
                    var rs = []; try { rs = (S.months[S.cur].rows || []).filter(function (r) { var k = (r.k || '').trim().toLowerCase(); return k && (k === key || k.indexOf(key) >= 0 || key.indexOf(k) >= 0) }) } catch (e) { }
                    if (!rs.length) { fe.textContent = 'Không thấy đơn nào của «' + G('bban').value.trim() + '» trong tháng đang chọn. Bạn có thể nhập tay.'; return }
                    box.innerHTML = ''; rs.slice(0, MAXR).forEach(function (r) { addRow({ name: (r.note || '').trim() || 'Hàng hóa', unit: r.u || 'kiện', qty: r.q || '', note: r.d ? 'Hàng về ' + dShort(r.d).slice(0, 5) : '' }) });
                    if (rs.length > MAXR) fe.textContent = 'Khách có ' + rs.length + ' đơn, chỉ lấy ' + MAXR + ' dòng đầu.'; draw()
                };

                /* xuất file */
                function render(k) {
                    return fontsReady().then(function () { var c = document.createElement('canvas'); paint(c, data(), k, getLogo() || logo); return c })
                }
                function check() {
                    var d = data(); if (!d.a.name) { G('bbfe').textContent = 'Nhập họ tên người giao (Bên A).'; G('bban').focus(); return null }
                    if (!d.items.some(function (i) { return i.name || num(i.qty) })) { G('bbfe').textContent = 'Nhập ít nhất 1 dòng hàng hóa.'; return null }
                    return d
                }
                function commit(d) {
                    var o = load(); o.b = d.b; o.place = d.place; if (d.no === defNo) { o.day = day; o.seq = seq } store(o); defNoUsed = true
                }
                var defNoUsed = false;
                function fname(d, ext) { return 'Bien-ban-nhan-hang-' + (d.no || 'moi').replace(/[^A-Za-z0-9_-]+/g, '-') + '.' + ext }
                function busy(b, on, t) { b.disabled = on; if (on) { b._t = b.textContent; b.textContent = t } else if (b._t) b.textContent = b._t }
                dlg.onsubmit = function (e) {
                    e.preventDefault(); var d = check(); if (!d) return; var b = G('bbdl'); busy(b, 1, 'Đang tạo PDF…');
                    render(3).then(function (c) { return new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', .93) }).then(function (bl) { return bl.arrayBuffer().then(function (ab) { return { ab: ab, c: c } }) }) })
                        .then(function (r) { return save(pdfFrom(new Uint8Array(r.ab), r.c.width, r.c.height), fname(d, 'pdf')).then(function () { commit(d); var m = G('bbfe'); m.style.color = '#15803d'; m.textContent = '✔ Đã tải file PDF. Mở file và in ra khổ A4 để ký.' }) })
                        .catch(function () { G('bbfe').textContent = 'Không tạo được file, hãy thử lại.' }).then(function () { busy(b, 0) })
                };
                G('bbpg').onclick = function () {
                    var d = check(); if (!d) return; var b = G('bbpg'); busy(b, 1, 'Đang tạo…');
                    render(3).then(function (c) { c.toBlob(function (bl) { save(bl, fname(d, 'png')).then(function () { commit(d) }).catch(function () { }).then(function () { busy(b, 0) }) }, 'image/png') }).catch(function () { busy(b, 0) })
                };
                G('bbpr').onclick = function () {
                    var d = check(); if (!d) return; var b = G('bbpr'); busy(b, 1, 'Đang mở…');
                    render(2.6).then(function (c) {
                        var u = c.toDataURL('image/jpeg', .92), w = window.open('', '_blank');
                        if (!w) { G('bbfe').textContent = 'Trình duyệt chặn cửa sổ in. Hãy dùng nút «Tải file PDF» rồi in từ file.'; return }
                        w.document.write('<!doctype html><title>' + E(fname(d, 'pdf')) + '</title><style>@page{size:A4;margin:0}html,body{margin:0;background:#fff}img{display:block;width:210mm;height:297mm}</style><img src="' + u + '">');
                        w.document.close(); var go = function () { w.focus(); w.print() }; var im = w.document.querySelector('img'); if (im.complete) setTimeout(go, 200); else im.onload = go; commit(d)
                    }).then(function () { busy(b, 0) })
                };
                var f0 = G('bban'); if (f0) f0.focus()
            }

            function mount() { open() }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
        })();
    </script>
</body>

</html>
